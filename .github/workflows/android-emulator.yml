name: 📱 Web Android Emulator for WhatsApp OTP & Pairing (Fast 60FPS Speed)

on:
  workflow_dispatch:

jobs:
  launch-android:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup KVM Hardware Acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo chmod 666 /dev/kvm || true

      - name: 🐳 Launch Fast High-Speed Docker Android (Spoofed Real Device)
        run: |
          docker run -d -p 6080:6080 -p 5554:5554 -p 5555:5555 \
            --privileged \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            -e WEB_VNC=true \
            --name android-container \
            budtmo/docker-android:emulator_11.0 || docker run -d -p 6080:6080 -p 5554:5554 -p 5555:5555 --privileged -e EMULATOR_DEVICE="Samsung Galaxy S10" -e WEB_VNC=true --name android-container budtmo/docker-android:latest

      - name: ⌛ Wait for Android Boot & Apply Device Spoofing
        run: |
          echo "Memuat Android System... Harap tunggu 40 detik."
          sleep 40
          docker exec -i android-container bash -c "adb shell settings put global window_animation_scale 0 && adb shell settings put global transition_animation_scale 0 && adb shell settings put global animator_duration_scale 0" || true
          docker exec -i android-container bash -c "adb shell setprop ro.product.model 'SM-G973F' && adb shell setprop ro.product.brand 'samsung' && adb shell setprop ro.product.manufacturer 'samsung'" || true

      - name: 📲 Direct Download, Install & Instant Open WhatsApp Official
        run: |
          echo "📥 Downloading WhatsApp Official APK directly from whatsapp.com..."
          curl -sL -o /tmp/wa.apk "https://www.whatsapp.com/android/current/WhatsApp.apk" || wget -q -O /tmp/wa.apk "https://www.whatsapp.com/android/current/WhatsApp.apk" || true
          ls -lh /tmp/wa.apk || true
          echo "⚙️ Copying and installing WhatsApp into Android Container..."
          docker cp /tmp/wa.apk android-container:/tmp/wa.apk || true
          docker exec -i android-container bash -c "adb wait-for-device" || true
          docker exec -i android-container bash -c "adb install -g -r /tmp/wa.apk" || true
          echo "🚀 Instant Launching WhatsApp on Screen..."
          docker exec -i android-container bash -c "adb shell am start -n com.whatsapp/.Main" || docker exec -i android-container bash -c "adb shell monkey -p com.whatsapp 1" || true
          echo "✅ WhatsApp successfully installed and opened on screen!"

      - name: 🌐 Create Secure Web Tunnel URL & Auto-Publish to Portal
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          echo "========================================================"
          echo "🚀 KUNJUNGI URL DI BAWAH INI UNTUK MENGAKSES ANDROID EMULATOR:"
          echo "========================================================"
          ssh -o StrictHostKeyChecking=no -R 80:localhost:6080 a.pinggy.io &
          cloudflared tunnel --url http://localhost:6080 2>&1 | tee /tmp/tunnel.log &
          sleep 12
          TUNNEL_URL=$(grep -o 'https://[a-zA-Z0-9-]*\.trycloudflare\.com' /tmp/tunnel.log | head -n 1 || true)
          if [ -n "$TUNNEL_URL" ]; then
            echo "{\"url\": \"$TUNNEL_URL\", \"timestamp\": \"$(date -u)\"}" > latest_tunnel.json
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add latest_tunnel.json
            git commit -m "Auto-update latest active tunnel URL" || true
            git push origin main || true
          fi
          wait

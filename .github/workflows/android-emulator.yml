name: 📱 Web Android Emulator for WhatsApp OTP & Pairing (Fast 60FPS Speed)

on:
  workflow_dispatch:

jobs:
  launch-android:
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Setup KVM Hardware Acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo chmod 666 /dev/kvm || true

      - name: 🐳 Launch Fast High-Speed Docker Android (Low-DPI 720p)
        run: |
          docker run -d -p 6080:6080 -p 5554:5554 -p 5555:5555 \
            --privileged \
            -e EMULATOR_DEVICE="Nexus 5" \
            -e WEB_VNC=true \
            --name android-container \
            budtmo/docker-android:emulator_11.0 || docker run -d -p 6080:6080 -p 5554:5554 -p 5555:5555 --privileged -e EMULATOR_DEVICE="Nexus 5" -e WEB_VNC=true --name android-container budtmo/docker-android:latest

      - name: ⌛ Wait for Android Boot & Apply Animation Speedup
        run: |
          echo "Memuat Android System... Harap tunggu 40 detik."
          sleep 40
          docker exec -i android-container bash -c "adb shell settings put global window_animation_scale 0 && adb shell settings put global transition_animation_scale 0 && adb shell settings put global animator_duration_scale 0" || true

      - name: 📲 Direct Download & Auto Install Official WhatsApp APK
        run: |
          echo "📥 Downloading WhatsApp Official APK..."
          curl -sL -o /tmp/wa.apk "https://www.whatsapp.com/android/current/WhatsApp.apk" || wget -q -O /tmp/wa.apk "https://www.whatsapp.com/android/current/WhatsApp.apk" || true
          ls -lh /tmp/wa.apk || true
          echo "⚙️ Installing APK into Android Container..."
          docker cp /tmp/wa.apk android-container:/tmp/wa.apk || true
          docker exec -i android-container bash -c "adb wait-for-device && adb install -g -r /tmp/wa.apk && adb shell monkey -p com.whatsapp 1" || true
          echo "✅ WhatsApp installation step complete!"

      - name: 🌐 Create Secure Web Tunnel URL (Zero Prompt Cloudflare & Pinggy)
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          echo "========================================================"
          echo "🚀 KUNJUNGI URL DI BAWAH INI UNTUK MENGAKSES ANDROID EMULATOR:"
          echo "========================================================"
          ssh -o StrictHostKeyChecking=no -R 80:localhost:6080 a.pinggy.io &
          cloudflared tunnel --url http://localhost:6080 || cloudflared tunnel --url http://localhost:6080

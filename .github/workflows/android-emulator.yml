name: 📱 Web Android Emulator for WhatsApp OTP & Pairing

on:
  workflow_dispatch:

jobs:
  launch-android:
    runs-on: ubuntu-latest
    steps:
      - name: ⚙️ Setup KVM Hardware Acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm libvirt-daemon-system libvirt-clients bridge-utils
          sudo chmod 666 /dev/kvm || true

      - name: 🐳 Launch Docker Android (noVNC Web Interface)
        run: |
          docker run -d -p 6080:6080 -p 5554:5554 -p 5555:5555 \
            --privileged \
            -e EMULATOR_DEVICE="Samsung Galaxy S10" \
            -e WEB_VNC=true \
            --name android-container \
            budtmo/docker-android:emulator_11.0 || docker run -d -p 6080:6080 -p 5554:5554 -p 5555:5555 --privileged -e EMULATOR_DEVICE="Samsung Galaxy S10" -e WEB_VNC=true --name android-container budtmo/docker-android:latest

      - name: ⌛ Wait for Android Boot
        run: |
          echo "Memuat Android System... Harap tunggu 40 detik."
          sleep 40

      - name: 📲 Auto Download & Install WhatsApp APK
        run: |
          echo "📥 Auto-installing WhatsApp Official APK..."
          docker exec -i android-container bash -c "wget -q -O /tmp/wa.apk 'https://androidapksfree.com/wp-content/uploads/apks/whatsapp-messenger-2-24-15-77.apk' && adb install -r /tmp/wa.apk" || true
          echo "✅ WhatsApp pre-installed on Android!"

      - name: 🌐 Create Secure Web Tunnel URL (With Retry & Localtunnel Fallback)
        run: |
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared-linux-amd64.deb
          echo "========================================================"
          echo "🚀 KUNJUNGI URL DI BAWAH INI UNTUK MENGAKSES ANDROID EMULATOR:"
          echo "========================================================"
          npx -y localtunnel --port 6080 &
          cloudflared tunnel --url http://localhost:6080 || cloudflared tunnel --url http://localhost:6080 || npx -y localtunnel --port 6080

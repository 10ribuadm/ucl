name: "🎬 HayukTube Render v2 — 360p"

on:
  repository_dispatch:
    types: [render_360p]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL to Download & Render (360p)'
        required: true
      category:
        description: 'Category'
        required: false
        default: 'General'

jobs:
  render_360p:
    name: "⚡ 360p Worker"
    runs-on: self-hosted

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🚀 Render 360p & Upload to Telegram Cloud Vault"
        env:
          TARGET_URL:    ${{ github.event.client_payload.url || github.event.inputs.video_url }}
          CATEGORY:      ${{ github.event.client_payload.category || github.event.inputs.category }}
          CALLBACK_URL:  ${{ github.event.client_payload.callback_url || 'https://tube.hayuk.web.id/api/webhook/download-complete' }}
          BOT_TOKEN:     ${{ github.event.client_payload.bot_token || secrets.TELEGRAM_BOT_TOKEN || '8899812523:AAHBTqKxaSiTWq8bRLs0tvuoktZyyc8W7ps' }}
          CHAT_ID:       ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID || '-1003811040179' }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          QUALITY:       "360p"
        run: |
          echo "🎯 Quality: 360p | URL: $TARGET_URL"
          python3 render_script_v2.py

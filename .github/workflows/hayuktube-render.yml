name: 🎬 HayukTube High-Speed Cloud Video Downloader & Renderer (1Gbps)

on:
  repository_dispatch:
    types: [render_video]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL Video YouTube'
        required: true
        default: ''
      category:
        description: 'Kategori Video'
        required: false
        default: 'General'

jobs:
  cloud-render:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install yt-dlp, ffmpeg & requests
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install yt-dlp requests

      - name: ⚡ High-Speed Cloud Download & Telegram Cloud Vault Sync
        env:
          TARGET_URL: ${{ github.event.client_payload.url || github.event.inputs.video_url }}
          CATEGORY: ${{ github.event.client_payload.category || github.event.inputs.category }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || 'https://tube.hayuk.web.id/api/webhook/download-complete' }}
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '7850550058:AAHshYnSff8Q_752qgM-yS5Uv-S5q2J-c0Q' }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '-1002425022830' }}
        run: |
          echo "🚀 Processing Target URL: $TARGET_URL"
          python -c "
          import os, sys, json, subprocess, requests

          url = os.environ.get('TARGET_URL')
          category = os.environ.get('CATEGORY', 'General')
          callback_url = os.environ.get('CALLBACK_URL')
          bot_token = os.environ.get('BOT_TOKEN')
          chat_id = os.environ.get('CHAT_ID')

          if not url:
              print('❌ No Target URL specified!')
              sys.exit(1)

          print('📥 Extracting metadata & downloading via yt-dlp high-speed...')
          dl_cmd = ['yt-dlp', '-f', 'bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best', '--no-playlist', '-o', '/tmp/video.%(ext)s', '--write-sub', '--sub-lang', 'id,en', '--convert-subs', 'vtt', '--write-thumbnail', '--convert-thumbnails', 'jpg', url]
          subprocess.run(dl_cmd, check=True)

          video_path = None
          for f in os.listdir('/tmp'):
              if f.startswith('video.') and f.endswith(('.mp4', '.mkv', '.webm')):
                  video_path = os.path.join('/tmp', f)
                  break

          if not video_path:
              print('❌ Download failed, video file not found.')
              sys.exit(1)

          print(f'✅ Downloaded video to {video_path} (Size: {os.path.getsize(video_path)} bytes)')

          meta_cmd = ['yt-dlp', '-j', '--no-playlist', url]
          res = subprocess.run(meta_cmd, capture_output=True, text=True)
          meta = json.loads(res.stdout) if res.returncode == 0 else {}

          title = meta.get('title', 'Cloud Video')
          duration = meta.get('duration', 0)
          description = meta.get('description', '')

          subtitles = []
          for sub_file in os.listdir('/tmp'):
              if sub_file.endswith('.vtt'):
                  lang = 'id' if '.id.' in sub_file else 'en'
                  with open(os.path.join('/tmp', sub_file), 'r', encoding='utf-8', errors='ignore') as sf:
                      vtt_content = sf.read()
                      subtitles.append({'lang': lang, 'label': 'Indonesian' if lang=='id' else 'English', 'vttData': vtt_content})

          thumb_path = None
          for tf in os.listdir('/tmp'):
              if tf.startswith('video.') and tf.endswith(('.jpg', '.png', '.webp')):
                  thumb_path = os.path.join('/tmp', tf)
                  break

          thumb_file_id = None
          if thumb_path:
              with open(thumb_path, 'rb') as tf:
                  resp = requests.post(f'https://api.telegram.org/bot{bot_token}/sendPhoto', data={'chat_id': chat_id, 'caption': f'Thumbnail: {title[:50]}'}, files={'photo': tf})
                  if resp.status_code == 200:
                      thumb_file_id = resp.json()['result']['photo'][-1]['file_id']

          CHUNK_SIZE = 15 * 1024 * 1024
          file_size = os.path.getsize(video_path)
          parts = []
          main_file_id = None

          with open(video_path, 'rb') as vf:
              part_idx = 0
              offset = 0
              while offset < file_size:
                  chunk = vf.read(CHUNK_SIZE)
                  chunk_len = len(chunk)
                  chunk_path = f'/tmp/chunk_{part_idx}.dat'
                  with open(chunk_path, 'wb') as cf:
                      cf.write(chunk)
                  
                  with open(chunk_path, 'rb') as cf:
                      resp = requests.post(f'https://api.telegram.org/bot{bot_token}/sendDocument', data={'chat_id': chat_id, 'caption': f'{title[:40]} Part {part_idx+1}'}, files={'document': cf})
                      if resp.status_code == 200:
                          doc = resp.json()['result']['document']
                          fid = doc['file_id']
                          msg_id = resp.json()['result']['message_id']
                          if part_idx == 0: main_file_id = fid
                          parts.append({'partIndex': part_idx, 'fileId': fid, 'messageId': msg_id, 'startByte': offset, 'endByte': offset + chunk_len - 1, 'chunkSize': chunk_len})
                  
                  if os.path.exists(chunk_path): os.remove(chunk_path)
                  offset += chunk_len
                  part_idx += 1

          payload = {
              'status': 'success',
              'media': {
                  'title': title,
                  'description': description[:500],
                  'category': category,
                  'duration': duration,
                  'fileSize': file_size,
                  'fileType': 'video',
                  'mimeType': 'video/mp4',
                  'fileId': main_file_id,
                  'thumbnailFileId': thumb_file_id or main_file_id,
                  'parts': parts,
                  'subtitles': subtitles
              }
          }

          print('📡 Sending Completion Callback to VPS:', callback_url)
          requests.post(callback_url, json=payload, timeout=15)
          print('✅ Process Completed Successfully!')
          "

name: 🎬 HayukTube High-Speed Cloud Video Downloader & Renderer (1Gbps)

on:
  repository_dispatch:
    types: [render_video]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL Video YouTube'
        required: true
        default: ''
      category:
        description: 'Kategori Video'
        required: false
        default: 'General'

jobs:
  cloud-render:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python & Dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install yt-dlp, ffmpeg & requests
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install -U yt-dlp requests

      - name: ⚡ High-Speed Cloud Download & Telegram Cloud Vault Sync
        env:
          TARGET_URL: ${{ github.event.client_payload.url || github.event.inputs.video_url }}
          CATEGORY: ${{ github.event.client_payload.category || github.event.inputs.category }}
          CALLBACK_URL: ${{ github.event.client_payload.callback_url || 'https://tube.hayuk.web.id/api/webhook/download-complete' }}
          BOT_TOKEN: ${{ github.event.client_payload.bot_token || secrets.TELEGRAM_BOT_TOKEN || '8899812523:AAHBTqKxaSiTWq8bRLs0tvuoktZyyc8W7ps' }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID || '-1003811040179' }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "🚀 Processing Target URL: $TARGET_URL"
          echo "📦 Telegram Target Cloud Vault Channel: $CHAT_ID"
          python -c "
          import os, sys, json, subprocess, requests, re

          url = os.environ.get('TARGET_URL')
          category = os.environ.get('CATEGORY', 'General')
          callback_url = os.environ.get('CALLBACK_URL')
          bot_token = os.environ.get('BOT_TOKEN')
          chat_id = os.environ.get('CHAT_ID')
          yt_cookies = os.environ.get('YOUTUBE_COOKIES')

          if not url:
              print('❌ No Target URL specified!')
              sys.exit(1)

          cookies_path = None
          if yt_cookies and yt_cookies.strip():
              cookies_path = '/tmp/yt_cookies.txt'
              with open(cookies_path, 'w', encoding='utf-8') as cf:
                  cf.write(yt_cookies.strip())
              print('🍪 Loaded YouTube Cookies from Secrets')

          # 1. Extract Video ID & Title/Thumbnail via YouTube oEmbed API (100% Fail-Proof)
          video_id = None
          match = re.search(r'(?:v=|\/|shorts\/)([0-9A-Za-z_-]{11})', url)
          if match:
              video_id = match.group(1)

          title = 'Downloaded Video'
          description = f'Source: {url}'
          duration = 0
          thumb_url = None

          if video_id:
              thumb_url = f'https://img.youtube.com/vi/{video_id}/maxresdefault.jpg'
              try:
                  oembed_resp = requests.get(f'https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v={video_id}&format=json', timeout=10)
                  if oembed_resp.status_code == 200:
                      o_data = oembed_resp.json()
                      if o_data.get('title'): title = o_data['title']
                      if o_data.get('author_name'): description = f\"Channel: {o_data['author_name']}\nSource: {url}\"
              except Exception as e_oembed: pass

          # 2. Download Video Stream via yt-dlp Multi-Client Strategy
          print('📥 Downloading video stream via yt-dlp high-speed...')
          clients_to_try = [
              'web_embedded,android_creator',
              'mweb,android_vr',
              'tv,mweb',
              'android,web'
          ]

          video_path = None
          for client in clients_to_try:
              print(f'⚡ Trying YouTube Client Strategy: {client}')
              dl_cmd = [
                  'yt-dlp',
                  '--extractor-args', f'youtube:player_client={client}',
                  '--user-agent', 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                  '-f', 'bestvideo[height<=1080]+bestaudio/bestvideo+bestaudio/best',
                  '--merge-output-format', 'mp4',
                  '--no-playlist',
                  '--no-check-certificates',
                  '-o', '/tmp/video.%(ext)s'
              ]
              if cookies_path:
                  dl_cmd.extend(['--cookies', cookies_path])
              dl_cmd.append(url)

              subprocess.run(dl_cmd)

              for f in os.listdir('/tmp'):
                  if f.startswith('video.') and f.endswith(('.mp4', '.mkv', '.webm')):
                      video_path = os.path.join('/tmp', f)
                      break
              if video_path:
                  print(f'✅ Success downloading video stream with client: {client}')
                  break

          if not video_path:
              print('⚠️ Retrying fallback direct HTTP stream download...')
              try:
                  res = requests.get(url, stream=True, timeout=60, headers={'User-Agent': 'Mozilla/5.0'})
                  if res.status_code == 200:
                      video_path = '/tmp/video.mp4'
                      with open(video_path, 'wb') as vf:
                          for chunk in res.iter_content(chunk_size=1024*1024):
                              if chunk: vf.write(chunk)
              except Exception as e_http: pass

          if not video_path or not os.path.exists(video_path):
              print('❌ Download failed, video file not found.')
              sys.exit(1)

          file_size = os.path.getsize(video_path)
          print(f'✅ Downloaded video to {video_path} (Size: {file_size} bytes)')

          # 3. Extract Metadata & Duration via yt-dlp
          meta_cmd = ['yt-dlp', '--extractor-args', 'youtube:player_client=android,web', '-j', '--no-playlist', url]
          if cookies_path: meta_cmd.extend(['--cookies', cookies_path])
          res = subprocess.run(meta_cmd, capture_output=True, text=True)
          if res.returncode == 0:
              try:
                  meta = json.loads(res.stdout)
                  if meta.get('title') and title == 'Downloaded Video': title = meta['title']
                  if meta.get('duration'): duration = meta['duration']
                  if meta.get('description'): description = meta['description']
                  if meta.get('thumbnail'): thumb_url = meta['thumbnail']
              except Exception: pass

          # 4. Fetch Subtitles (if any)
          subtitles = []
          try:
              sub_cmd = ['yt-dlp', '--extractor-args', 'youtube:player_client=web_embedded', '--write-sub', '--write-auto-sub', '--sub-lang', 'id,en', '--convert-subs', 'vtt', '--skip-download', '--no-playlist', '-o', '/tmp/video.%(ext)s', url]
              if cookies_path: sub_cmd.extend(['--cookies', cookies_path])
              subprocess.run(sub_cmd)
              for sub_file in os.listdir('/tmp'):
                  if sub_file.endswith('.vtt'):
                      lang = 'id' if '.id.' in sub_file else 'en'
                      with open(os.path.join('/tmp', sub_file), 'r', encoding='utf-8', errors='ignore') as sf:
                          vtt_content = sf.read()
                          subtitles.append({'lang': lang, 'label': 'Indonesian' if lang=='id' else 'English', 'vttData': vtt_content})
          except Exception as e_sf: pass

          # 5. Fetch HD Thumbnail Cover & Upload to Telegram as Photo
          thumb_file_id = None
          thumb_path = '/tmp/thumbnail.jpg'

          if thumb_url:
              try:
                  t_res = requests.get(thumb_url, timeout=15)
                  if t_res.status_code == 200:
                      with open(thumb_path, 'wb') as tf:
                          tf.write(t_res.content)
              except Exception as e_th_dl: pass

          if not os.path.exists(thumb_path) or os.path.getsize(thumb_path) == 0:
              if video_id:
                  try:
                      hq_res = requests.get(f'https://img.youtube.com/vi/{video_id}/hqdefault.jpg', timeout=15)
                      if hq_res.status_code == 200:
                          with open(thumb_path, 'wb') as tf:
                              tf.write(hq_res.content)
                  except Exception: pass

          if os.path.exists(thumb_path) and os.path.getsize(thumb_path) > 0:
              try:
                  with open(thumb_path, 'rb') as tf:
                      files = {'photo': ('thumbnail.jpg', tf, 'image/jpeg')}
                      resp = requests.post(f'https://api.telegram.org/bot{bot_token}/sendPhoto', data={'chat_id': chat_id, 'caption': f'🖼️ Thumbnail for {title[:50]}'}, files=files)
                      if resp.status_code == 200 and resp.json().get('ok'):
                          thumb_file_id = resp.json()['result']['photo'][-1]['file_id']
                          print('🖼️ Thumbnail photo uploaded successfully! File ID:', thumb_file_id)
              except Exception as e_tp:
                  print('Thumbnail upload warning:', e_tp)

          # 6. Upload Video Chunk(s) to Telegram Vault as valid MP4 media
          clean_title = re.sub(r'[^\w\s-]', '', title).strip() or 'Video'
          CHUNK_SIZE = 15 * 1024 * 1024
          parts = []
          main_file_id = None

          with open(video_path, 'rb') as vf:
              part_idx = 0
              offset = 0
              num_parts = (file_size + CHUNK_SIZE - 1) // CHUNK_SIZE
              while offset < file_size:
                  chunk = vf.read(CHUNK_SIZE)
                  chunk_len = len(chunk)
                  chunk_path = f'/tmp/chunk_{part_idx}.mp4'
                  with open(chunk_path, 'wb') as cf:
                      cf.write(chunk)
                  
                  upload_filename = f\"{clean_title[:30]}.mp4\" if num_parts == 1 else f\"{clean_title[:30]}_part{part_idx+1}.mp4\"
                  
                  with open(chunk_path, 'rb') as cf:
                      files = {'document': (upload_filename, cf, 'video/mp4')}
                      resp = requests.post(f'https://api.telegram.org/bot{bot_token}/sendDocument', data={'chat_id': chat_id, 'caption': f'🎬 {title[:40]} (Part {part_idx+1}/{num_parts})'}, files=files)
                      if resp.status_code == 200 and resp.json().get('ok'):
                          doc = resp.json()['result']['document']
                          fid = doc['file_id']
                          msg_id = resp.json()['result']['message_id']
                          if part_idx == 0: main_file_id = fid
                          parts.append({'partIndex': part_idx, 'fileId': fid, 'messageId': msg_id, 'startByte': offset, 'endByte': offset + chunk_len - 1, 'chunkSize': chunk_len})
                  
                  if os.path.exists(chunk_path): os.remove(chunk_path)
                  offset += chunk_len
                  part_idx += 1

          payload = {
              'status': 'success',
              'media': {
                  'title': title,
                  'description': description[:500],
                  'category': category,
                  'duration': duration,
                  'fileSize': file_size,
                  'fileType': 'video',
                  'mimeType': 'video/mp4',
                  'fileId': main_file_id,
                  'thumbnailFileId': thumb_file_id or main_file_id,
                  'parts': parts,
                  'subtitles': subtitles
              }
          }

          print('📡 Sending Completion Callback to VPS:', callback_url)
          try:
              cb_res = requests.post(callback_url, json=payload, timeout=15)
              print('✅ Process Completed Successfully! Callback status:', cb_res.status_code)
          except Exception as e_cb:
              print('Callback warning:', e_cb)
          "

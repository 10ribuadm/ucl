name: "🎬 HayukTube Render v2 — 720p HD"

on:
  repository_dispatch:
    types: [render_720p]
  workflow_dispatch:
    inputs:
      video_url:
        description: 'YouTube URL to Download & Render (720p)'
        required: true
      category:
        description: 'Category (MUSIC, VIRAL, GENERAL, GAMING, HIBURAN)'
        required: false
        default: 'General'

jobs:
  render_720p:
    name: "⚡ 720p HD Worker"
    runs-on: [self-hosted, ubuntu-latest]
    timeout-minutes: 180

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "⚙️ Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "🛡️ Setup Cloudflare WARP (Bypass Datacenter IP Block)"
        uses: fscarmen/warp-on-actions@main

      - name: "🦕 Install Deno Runtime (yt-dlp JS Solver)"
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
          export PATH="$HOME/.deno/bin:$PATH"
          deno --version

      - name: "📦 Install Dependencies"
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg libcurl4-openssl-dev
          python -m pip install --upgrade pip
          pip install --no-cache-dir yt-dlp pytubefix cloudscraper requests curl_cffi

      - name: "🚀 Render 720p & Upload to Telegram Cloud Vault"
        env:
          TARGET_URL:    ${{ github.event.client_payload.url || github.event.inputs.video_url }}
          CATEGORY:      ${{ github.event.client_payload.category || github.event.inputs.category }}
          CALLBACK_URL:  ${{ github.event.client_payload.callback_url || 'https://tube.hayuk.web.id/api/webhook/download-complete' }}
          BOT_TOKEN:     ${{ github.event.client_payload.bot_token || secrets.TELEGRAM_BOT_TOKEN || '8899812523:AAHBTqKxaSiTWq8bRLs0tvuoktZyyc8W7ps' }}
          CHAT_ID:       ${{ github.event.client_payload.chat_id || secrets.TELEGRAM_CHAT_ID || '-1003811040179' }}
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          QUALITY:       "720p"
        run: |
          export PATH="$HOME/.deno/bin:$PATH"
          echo "🎯 Quality: 720p | URL: $TARGET_URL"
          python3 render_script_v2.py

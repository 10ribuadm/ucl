<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📱 Android Remote Emulator - emu.hayuk.web.id</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #04070d;
      --card-bg: #0b1329;
      --primary: #10b981;
      --accent: #38bdf8;
      --border: rgba(255, 255, 255, 0.1);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    html, body { height: 100%; width: 100%; overflow: hidden; background: var(--bg); color: #fff; display: flex; flex-direction: column; }

    header {
      background: var(--card-bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      z-index: 100;
      flex-shrink: 0;
    }
    .brand { font-size: 16px; font-weight: 800; color: #fff; display: flex; align-items: center; gap: 8px; }
    .brand span { color: var(--primary); }

    .controls { display: flex; gap: 10px; align-items: center; flex: 1; max-width: 800px; }
    .input-url {
      flex: 1;
      padding: 9px 14px;
      background: #04070d;
      border: 1px solid #334155;
      border-radius: 8px;
      color: #38bdf8;
      font-weight: 600;
      font-size: 13px;
    }
    .btn {
      padding: 9px 16px;
      border-radius: 8px;
      border: none;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .btn-primary { background: linear-gradient(135deg, #10b981, #059669); color: #fff; }
    .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-secondary { background: #1e293b; color: #fff; border: 1px solid #334155; }
    .btn-secondary:hover { background: #334155; }

    main { flex: 1; width: 100%; height: 100%; position: relative; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; outline: none; }

    .placeholder-box {
      text-align: center;
      padding: 40px 20px;
      max-width: 540px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .status-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      📱 <span>emu.hayuk.web.id</span>
    </div>

    <div class="controls">
      <input type="text" id="tunnelUrlInput" class="input-url" placeholder="Tempel URL Tunnel (contoh: https://lemon-apes-dress.loca.lt atau https://xxxx.trycloudflare.com)...">
      <button class="btn btn-primary" onclick="connectEmulator()">🚀 Connect Layar Fullscreen</button>
      <button class="btn btn-secondary" onclick="toggleBrowserFullscreen()">🖥️ Toggle Fullscreen Browser</button>
      <a href="https://github.com/10ribuadm/ucl/actions" target="_blank" class="btn btn-secondary">⚡ Run Actions</a>
    </div>
  </header>

  <main id="mainContainer">
    <div class="placeholder-box" id="placeholderBox">
      <span class="status-badge">⚡ WAITING FOR EMULATOR TUNNEL</span>
      <h2 style="font-size: 22px; margin-bottom: 12px;">📱 Web Android Control Hub</h2>
      <p style="color: #94a3b8; font-size: 14px; line-height: 1.6; margin-bottom: 24px;">
        Tempelkan <b>URL Tunnel terbaru</b> dari log GitHub Actions di atas lalu klik <b>Connect Layar Fullscreen</b> untuk mengontrol HP Android!
      </p>
      <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;">
        <a href="https://github.com/10ribuadm/ucl/actions" target="_blank" class="btn btn-primary">⚡ 1. Buka & Run GitHub Actions</a>
      </div>
    </div>
    <iframe id="emulatorIframe" style="display: none;" allow="fullscreen; clipboard-read; clipboard-write; autoplay; camera; microphone;" allowfullscreen="true" src="about:blank"></iframe>
  </main>

  <script>
    function connectEmulator() {
      const input = document.getElementById('tunnelUrlInput');
      let url = input.value.trim();

      if (!url) {
        alert('Masukkan URL Tunnel terlebih dahulu!');
        return;
      }

      if (!url.startsWith('http://') && !url.startsWith('https://')) {
        url = 'https://' + url;
      }

      // Handle localtunnel / pinggy vs cloudflare pathing to prevent 404
      if (url.includes('.loca.lt') || url.includes('pinggy') || url.includes('ngrok')) {
        // Keep root URL clean for localtunnel / pinggy / ngrok
      } else if (!url.includes('/app/ui.html') && !url.includes('/vnc.html')) {
        url = url.replace(/\/$/, '') + '/app/ui.html?autoconnect=true&resize=scale';
      }

      document.getElementById('placeholderBox').style.display = 'none';
      const iframe = document.getElementById('emulatorIframe');
      iframe.style.display = 'block';
      iframe.src = url;
    }

    function toggleBrowserFullscreen() {
      const elem = document.documentElement;
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    // Auto-connect if URL parameter exists
    const urlParams = new URLSearchParams(window.location.search);
    const paramUrl = urlParams.get('url');
    if (paramUrl) {
      document.getElementById('tunnelUrlInput').value = paramUrl;
      connectEmulator();
    }
  </script>
</body>
</html>
